<body>
<div id="profileSetup" class="profile-setup" style="display:none">

  </div>
</div>

  <div class="app">
    <aside class="sidebar">
    <div class="brand-wrap">
      <div class="brand-logo">S</div>
      <div><div class="brand">NEET 2027</div><div class="brand-user" id="brandUser">My Study Hub</div></div>
    </div>
      <button class="mobile-menu-toggle" id="mobileMenuToggle" type="button" aria-expanded="false" aria-controls="siteNavigation" aria-label="Open menu">☰</button>
      <nav id="siteNavigation">
        <button class="nav-item active" data-page="dashboard"><span>▦</span>Dashboard</button>
        <button class="nav-item" data-page="syllabus"><span>▣</span>Syllabus</button>
        <button class="nav-item" data-page="practice"><span>✎</span>Topic Practice</button>

        <button class="nav-item" data-page="leaderboard"><span>♜</span>Leaderboard</button>
        <button class="nav-item" data-page="calendar"><span>▦</span>Study Calendar</button>

      </div>

      <div class="google-auth-status" id="googleAuthStatus" aria-live="polite">Sign in with Google to use your account.</div>

        <button id="themeToggle" type="button">☀️ <span id="themeLabel">Light mode</span></button>

    <main id="main"></main>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const subjects = {
  Physics:["Units & Measurement","Kinematics","Laws of Motion","Work, Energy & Power","Rotational Motion","Gravitation","Properties of Solids & Fluids","Thermodynamics","Kinetic Theory","Oscillations & Waves","Electrostatics","Current Electricity","Magnetic Effects of Current","Electromagnetic Induction","Optics","Dual Nature of Matter","Atoms & Nuclei","Electronic Devices"],
  Chemistry:["Some Basic Concepts of Chemistry","Structure of Atom","Classification of Elements","Chemical Bonding","Thermodynamics","Equilibrium","Redox Reactions","Solutions","Electrochemistry","Chemical Kinetics","Surface Chemistry","Coordination Compounds","Organic Chemistry Basics","Hydrocarbons","Haloalkanes & Haloarenes","Alcohols, Phenols & Ethers","Aldehydes & Ketones","Amines","Biomolecules"],
  Botany:["The Living World","Biological Classification","Plant Kingdom","Morphology of Flowering Plants","Anatomy of Flowering Plants","Cell: Structure & Function","Cell Cycle","Photosynthesis","Respiration in Plants","Plant Growth & Development","Sexual Reproduction in Flowering Plants","Principles of Inheritance","Molecular Basis of Inheritance","Strategies for Enhancement","Ecology","Biodiversity"],
  Zoology:["Animal Kingdom","Structural Organisation in Animals","Human Physiology","Digestion & Absorption","Breathing & Exchange of Gases","Body Fluids & Circulation","Excretory Products","Locomotion & Movement","Neural Control","Chemical Coordination","Human Reproduction","Reproductive Health","Evolution","Human Health & Disease","Microbes in Human Welfare"]
};
const colors={Physics:"#5b8def",Chemistry:"#b37bea",Botany:"#49bd79",Zoology:"#f0a553"};
let currentSubject="Physics", timer=0, running=false, interval=null;
let checked=JSON.parse(localStorage.getItem("neetChecked")||"{}");
let sessions=JSON.parse(localStorage.getItem("neetSessions")||"[]");
let checkins=JSON.parse(localStorage.getItem("neetCheckins")||"{}");
let discussions=JSON.parse(localStorage.getItem("neetDiscussions")||"[]");

function pageShell(title,sub,body){return `<h1>${title}</h1><div class="subtitle">${sub}</div>${body}`}
function dashboard(){
  const totalDone=Object.values(checked).filter(Boolean).length;
  const total=Object.values(subjects).reduce((a,b)=>a+b.length,0);
  const pct=Math.round(totalDone/total*100);
  return pageShell("Dashboard","Your NEET 2027 prep, at a glance.",`
  <section class="card"><div class="muted">Countdown to NEET 2027 <span class="tag">expected date, unconfirmed</span></div>
  <div class="countdown" id="countdown"></div></section>
  <div class="progress-row"><div class="progress"><i style="width:${pct}%"></i></div><span class="muted">${totalDone}/${total} · ${pct}%</span></div>
  <h2>This week's study time</h2><section class="card stats-card">${donut(totalStudy())}<div class="legend">${legend()}</div></section>`);
}
function donut(hours){const total=hours||0;return `<div class="donut" style="background:conic-gradient(#5b8def ${Math.min(total/10*360,360)}deg,#23272e 0deg)"><div class="donut-label">${total.toFixed(1)}h<small>total</small></div></div>`}
function legend(){return Object.keys(subjects).map(s=>`<div class="legend-row"><span class="dot" style="background:${colors[s]}"></span>${s}<span class="hours">${subjectHours(s).toFixed(1)}h</span></div>`).join("")}
function subjectHours(s){return sessions.filter(x=>x.subject===s).reduce((a,x)=>a+x.seconds,0)/3600}
function totalStudy(){return sessions.reduce((a,x)=>a+x.seconds,0)/3600}

function syllabus(){
  const list=subjects[currentSubject];
  return pageShell("Syllabus","Physics · Chemistry · Botany · Zoology — check off topics as you cover them.",`
  <div class="notice">NTA/NMC hasn't officially released the NEET 2027 syllabus yet. This tracker uses a current structure carried over from the latest available syllabus. Re-check chapter names against the official PDF when it is released.</div>
  <div class="subject-grid">${Object.entries(subjects).map(([s,a])=>`<button class="subject ${s===currentSubject?"selected":""}" data-subject="${s}"><b>${s}</b><small>${a.filter(x=>checked[s+"-"+x]).length}/${a.length} · ${Math.round(a.filter(x=>checked[s+"-"+x]).length/a.length*100)}%</small><div class="progress" style="margin-top:12px;height:5px"><i style="width:${a.filter(x=>checked[s+"-"+x]).length/a.length*100}%"></i></div></button>`).join("")}</div>
  <div class="list">${list.map((x,i)=>`<label class="chapter"><input type="checkbox" data-check="${currentSubject}-${x}" ${checked[currentSubject+"-"+x]?"checked":""}><b>${x}</b><span class="arrow">0/4 ›</span></label>`).join("")}</div>`);
}
function timerPage(){
  return pageShell("Study Timer","Pick a subject and track how long you study it.",`
  <section class="card timer-card"><div class="tabs">${Object.keys(subjects).map(s=>`<button class="tab ${s===currentSubject?"active":""}" data-timersubject="${s}">${s}</button>`).join("")}</div>
  <div class="clock" id="clock">${fmt(timer)}</div>
  <div class="actions"><button class="btn primary" id="start">${running?"Pause":"Start"}</button><button class="btn green" id="save">Save session</button><button class="btn" id="discard">Discard</button></div></section>`);
}
function reports(){
  return pageShell("Reports","How your study time splits across subjects.",`
  <section class="card"><div class="pills"><button class="pill active">Today</button><button class="pill">This week</button><button class="pill">This month</button></div>
  <div class="stats-card">${donut(totalStudy())}<div class="legend">${legend()}</div></div>
  <div class="empty">${sessions.length} sessions logged in this period</div></section>`);
}
function simplePage(title,sub,body){return pageShell(title,sub,body)}
let calendarDate = new Date();
let selectedCalendarDate = new Date();
let targets = JSON.parse(localStorage.getItem("neetDailyTargets") || "{}");

function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function prettyDate(d){
  return d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function calendar(){
  const year=calendarDate.getFullYear(), month=calendarDate.getMonth();
  const first=new Date(year,month,1), last=new Date(year,month+1,0);
  const startDay=first.getDay();
  const days=last.getDate();
  const prevDays=new Date(year,month,0).getDate();
  const cells=[];
  for(let i=0;i<42;i++){
    let day=i-startDay+1, d, muted=false;
    if(day<1){d=new Date(year,month-1,prevDays+day);muted=true}
    else if(day>days){d=new Date(year,month+1,day-days);muted=true}
    else d=new Date(year,month,day);
    const key=dateKey(d), list=targets[key]||[];
    const isToday=key===dateKey(new Date()), isSelected=key===dateKey(selectedCalendarDate);
    cells.push(`<button class="calendar-date ${muted?"muted-date":""} ${isToday?"today":""} ${isSelected?"selected":""}" data-date="${key}">
      <span class="date-number">${d.getDate()}</span>
      ${list.length?`<span class="target-count">${list.filter(x=>x.done).length}/${list.length}</span>`:""}
      ${list.slice(0,2).map(x=>`<div class="mini-target">${x.done?"✓ ":""}${escapeHtml(x.text)}</div>`).join("")}
    </button>`);
  }
  const list=targets[dateKey(selectedCalendarDate)]||[];
  return pageShell("Study Calendar","Plan exactly what you want to finish each day — your daily targets are saved automatically.",`
  <div class="calendar-wrap">
    <section class="card">
      <div class="calendar-head">
        <h2>${calendarDate.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h2>
        <div class="month-nav">
          <button id="prevMonth">←</button><button id="todayMonth">Today</button><button id="nextMonth">→</button>
        </div>
      </div>
      <div class="calendar-grid">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="weekday">${x}</div>`).join("")}
        ${cells.join("")}
      </div>
    </section>
    <section class="card target-panel">
      <h3>Daily Targets</h3>
      <div class="target-date-label">${prettyDate(selectedCalendarDate)}</div>
      <div class="target-input">
        <input id="targetInput" placeholder="e.g. Complete Kinematics numericals" />
        <button id="addTarget">Add</button>
      </div>
      <div class="target-list">
        ${list.length ? list.map((x,i)=>`<div class="target-item ${x.done?"done":""}">
          <input type="checkbox" data-target-toggle="${i}" ${x.done?"checked":""}>
          <span>${escapeHtml(x.text)}</span>
          <button class="target-delete" data-target-delete="${i}">×</button>
        </div>`).join("") : `<div class="no-targets">No targets for this day yet.<br>Add your first task above.</div>`}
      </div>
    </section>
  </div>`);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function saveTargets(){
  localStorage.setItem("neetDailyTargets",JSON.stringify(targets));
}
function addTarget(text){
  const key=dateKey(selectedCalendarDate);
  if(!text.trim()) return;
  if(!targets[key]) targets[key]=[];
  targets[key].push({text:text.trim(),done:false});
  saveTargets(); render("calendar");
}
let leaderboardRows=[],leaderboardError="",leaderboardLoading=false,leaderboardPoll=null,activePage="dashboard";
function leaderboardTable(){
  if(!window.neetGoogleUser)return `<div class="empty">Sign in with Google to join the live leaderboard. Your name and saved study hours will be visible to other signed-in students.</div>`;
  if(leaderboardLoading&&!leaderboardRows.length)return `<div class="empty">Loading the live rankings…</div>`;
  if(leaderboardError&&!leaderboardRows.length)return `<div class="empty">${escapeHtml(leaderboardError)} <button class="btn" id="leaderboardRetry">Try again</button></div>`;
  if(!leaderboardRows.length)return `<div class="empty">No study hours recorded yet. Save a session with the Study Timer to appear here.</div>`;
  return `<div style="overflow-x:auto"><table class="table"><thead><tr><th>Rank</th><th>Student</th><th>Total study time</th></tr></thead><tbody>${leaderboardRows.map((row,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(row.display_name||"Student")}${row.user_id===window.neetGoogleUser?.id?" <span class=\"tag\">You</span>":""}</td><td>${(Number(row.study_seconds||0)/3600).toFixed(1)} h</td></tr>`).join("")}</tbody></table></div>`;
}
function leaderboard(){return simplePage("Leaderboard","Live ranking by saved Study Timer hours. Rankings refresh automatically.",`<div class="personal-hero"><div><div class="eyebrow">NEET STUDY HOURS</div><h1>Study consistently. Climb the ranks.</h1><p>Only signed-in students appear. Your display name and total saved study hours are shared with signed-in users.</p></div><div class="hero-avatar">🏆</div></div><section class="card"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px"><strong>Top students</strong><button class="btn" id="leaderboardRefresh">Refresh</button></div><div id="leaderboardContent">${leaderboardTable()}</div><p class="muted" style="font-size:12px;margin:14px 0 0">Hours are based on sessions saved with the Study Timer. Sign in to add your hours.</p></section>`)}
async function loadLeaderboard(){
  const client=window.neetSupabase;
  if(!client||!window.neetGoogleUser){leaderboardRows=[];leaderboardError="";leaderboardLoading=false;const box=document.querySelector("#leaderboardContent");if(box)box.innerHTML=leaderboardTable();return}
  leaderboardLoading=true;leaderboardError="";
  const box=document.querySelector("#leaderboardContent");if(box&&!leaderboardRows.length)box.innerHTML=leaderboardTable();
  const {data,error}=await client.from("study_leaderboard").select("user_id,display_name,study_seconds,updated_at").order("study_seconds",{ascending:false}).order("updated_at",{ascending:true}).limit(100);
  leaderboardLoading=false;
  if(error){leaderboardError="Could not load rankings. Check that the leaderboard database setup is complete.";if(!leaderboardRows.length)leaderboardRows=[]}
  else{leaderboardRows=data||[];leaderboardError=""}
  const currentBox=document.querySelector("#leaderboardContent");if(currentBox)currentBox.innerHTML=leaderboardTable();
  const retry=document.querySelector("#leaderboardRetry");if(retry)retry.onclick=loadLeaderboard;
}
async function publishSavedStudySession(seconds){

function finishMock(){
  if(!mockState)return;
  const t=mockTests[mockState.id];
  clearInterval(mockTimer); mockTimer=null;
  let score=0;
  t.questions.forEach((q,i)=>{if(mockState.answers[i]===q.a)score++;});
  const results=JSON.parse(localStorage.getItem("neetMockResults")||"[]");
  results.unshift({title:t.title,score,total:t.questions.length,date:new Date().toISOString()});
  localStorage.setItem("neetMockResults",JSON.stringify(results.slice(0,20)));
  const breakdown=Object.entries(t.questions.reduce((a,q,i)=>{
    a[q.s]??={correct:0,total:0};a[q.s].total++;if(mockState.answers[i]===q.a)a[q.s].correct++;return a;
  },{})).map(([sub,v])=>`<div class="mock-breakdown-row"><span>${sub}</span><strong>${v.correct}/${v.total}</strong></div>`).join("");
  document.querySelector("#main").innerHTML=pageShell("Test Result",t.title,`
    <section class="card result-hero"><div class="result-score">${score}<small>/${t.questions.length}</small></div><h2>${score===t.questions.length?"Perfect score!":score>=t.questions.length*.7?"Strong attempt!":"Keep practicing — review the paper below."}</h2><p class="muted">Your result has been saved on this browser.</p></section>
    <section class="card"><h2>Subject breakdown</h2>${breakdown}</section>
    <section class="card"><h2>Question review</h2>${t.questions.map((q,i)=>{
      const your=mockState.answers[i], ok=your===q.a;
      return `<div class="review-item ${ok?"correct":"wrong"}"><strong>Q${i+1}. ${esc(q.q)}</strong><div>Your answer: ${your===undefined?"Not answered":esc(q.o[your])}</div><div>Correct answer: ${esc(q.o[q.a])}</div></div>`;
    }).join("")}</section>
    <button class="btn primary" id="backToMocks">Back to Mock Tests</button>
  `);
  mockState=null;
  applyProfile();
  document.querySelector("#backToMocks").onclick=()=>render("mock");
}

function startMock(id){
  clearInterval(mockTimer);
  const t=mockTests[id];
  mockState={id,answers:{},remaining:t.duration*60};
  render("mockRun");
}

function bindMockTest(){
  if(!mockState)return;
  const t=mockTests[mockState.id];
  document.querySelectorAll("[data-answer]").forEach(inp=>inp.onchange=()=>{
    mockState.answers[Number(inp.dataset.answer)]=Number(inp.value);
    inp.closest("label").classList.add("selected");
    const nav=document.querySelector(`[data-jump="${inp.dataset.answer}"]`);
    if(nav)nav.classList.add("answered");
  });
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>document.querySelector("#q"+b.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"}));
  document.querySelector("#backMocks").onclick=()=>{clearInterval(mockTimer);mockState=null;render("mock")};
  document.querySelector("#submitMock").onclick=finishMock;
  document.querySelector("#submitMockBottom").onclick=finishMock;
  mockTimer=setInterval(()=>{
    if(!mockState)return;
    mockState.remaining--;
    const el=document.querySelector("#mockClock");
    if(el){const m=String(Math.max(0,Math.floor(mockState.remaining/60))).padStart(2,"0"),s=String(Math.max(0,mockState.remaining%60)).padStart(2,"0");el.textContent=`${m}:${s}`;}
    if(mockState.remaining<=0)finishMock();
  },1000);
}

function todayKey(){return dateKey(new Date())}
function calcStreak(){
  let streak=0,d=new Date();
  while(checkins[dateKey(d)]){streak++;d.setDate(d.getDate()-1)}
  return streak;
}
function longestStreak(){
  const keys=Object.keys(checkins).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{const d=new Date(k+"T00:00:00");if(prev&&(d-prev)/86400000===1)run++;else run=1;best=Math.max(best,run);prev=d});
  return best;
}

// Original chapter-specific fact pairs are converted into forward and reverse
// MCQs, giving every Biology and Chemistry chapter a 10-question starter set.
const addConceptSet=(subject,topic,facts)=>{
 const wrongPool=facts.map(x=>x[1]);
 facts.forEach(([term,detail,why],n)=>{
  const distractors=[1,2,3].map(k=>wrongPool[(n+k)%wrongPool.length]);
  const opts=[detail,...distractors],order=[0,1,2,3].sort((a,b)=>((a*7+n*3+1)%11)-((b*7+n*3+1)%11)),answer=order.indexOf(0);
  practiceQuestions.push({s:subject,t:topic,q:`Which statement about ${term} is correct?`,o:order.map(i=>opts[i]),a:answer,e:why});
  const termOpts=[term,...[1,2,3].map(k=>facts[(n+k)%facts.length][0])],order2=[0,1,2,3].sort((a,b)=>((a*5+n*2+3)%13)-((b*5+n*2+3)%13));
  practiceQuestions.push({s:subject,t:topic,q:`Which term matches this description: “${detail}”?`,o:order2.map(i=>termOpts[i]),a:order2.indexOf(0),e:`${term}: ${why}`});
 });
};

let practiceSubject="Physics",practiceTopic="Kinematics",practiceIndex=0,practiceScore=0,practiceChoice=null;
let practiceStats=JSON.parse(localStorage.getItem("neetPracticeStats")||"{}");
function practiceReset(){practiceIndex=0;practiceScore=0;practiceChoice=null}
function practiceSet(subject,topic){
 return practiceQuestions.filter(q=>q.s===subject&&q.t===topic);
}
function practice(){
 const topics=subjects[practiceSubject];if(!topics.includes(practiceTopic))practiceTopic=topics[0];
 const qs=practiceSet(practiceSubject,practiceTopic),key=practiceSubject+"|"+practiceTopic,st=practiceStats[key]||{a:0,c:0};
 const controls=`<div class="practice-controls"><label>Subject<select id="practiceSubject">${Object.keys(subjects).map(s=>`<option ${s===practiceSubject?"selected":""}>${s}</option>`).join("")}</select></label><label>Chapter / topic<select id="practiceTopic">${topics.map(t=>`<option ${t===practiceTopic?"selected":""}>${t}</option>`).join("")}</select></label></div>`;
 const badges=`<div class="practice-stats"><span class="tag">Score: ${st.c}/${st.a}</span><span class="tag">${qs.length} MCQs in this topic</span></div>`;
 if(!qs.length)return pageShell("Topic Practice","Practice using multiple-choice questions only.",`${controls}<section class="card"><div class="practice-empty"><h2>No MCQs available for this chapter yet</h2><p>Choose another chapter to practice the available questions.</p></div></section>`);
 if(practiceIndex>=qs.length)return pageShell("Topic Practice","Practice every listed chapter with original multiple-choice questions.",`${controls}<section class="card"><div class="practice-empty"><h2>Chapter set complete</h2><p>Your score: <strong>${practiceScore} of ${qs.length}</strong>.</p><button class="btn primary" id="practiceAgain">Try this chapter again</button></div></section><div class="practice-footer">${badges}</div>`);
 const q=qs[practiceIndex];
 const feedback=practiceChoice===null?"":`<div class="practice-feedback ${practiceChoice===q.a?"correct":"incorrect"}"><strong>${practiceChoice===q.a?"Correct":"Not quite"}.</strong> ${q.e}</div>`;
 return pageShell("Topic Practice","Practice using multiple-choice questions only.",`${controls}<section class="card"><div class="practice-progress"><span>${practiceSubject} · ${practiceTopic}</span><span>Question ${practiceIndex+1} of ${qs.length} · MCQ</span></div><div class="practice-question">${q.q}</div><div class="practice-options">${q.o.map((x,i)=>`<button class="practice-option ${practiceChoice!==null&&i===q.a?"correct":""} ${practiceChoice===i&&i!==q.a?"incorrect":""}" data-practice-option="${i}" ${practiceChoice!==null?"disabled":""}>${String.fromCharCode(65+i)}. ${x}${practiceChoice!==null&&i===q.a?" ✓ Correct answer":practiceChoice===i?" ✕ Your answer":""}</button>`).join("")}</div>${feedback}<div class="practice-footer">${badges}${practiceChoice!==null?`<button class="btn primary" id="practiceNext">${practiceIndex+1===qs.length?"See results":"Next question →"}</button>`:""}</div></section><p class="muted" style="font-size:12px;margin-top:12px">These are original sample MCQs, not official NEET previous-year questions. Check the official NEET syllabus when planning your preparation.</p>`);
}
function answerPractice(i){if(practiceChoice!==null)return;practiceChoice=i;const q=practiceSet(practiceSubject,practiceTopic)[practiceIndex],key=practiceSubject+"|"+practiceTopic,st=practiceStats[key]||{a:0,c:0};st.a++;if(i===q.a){st.c++;practiceScore++}practiceStats[key]=st;localStorage.setItem("neetPracticeStats",JSON.stringify(practiceStats));render("practice")}

function fmt(sec){const h=String(Math.floor(sec/3600)).padStart(2,"0"),m=String(Math.floor(sec%3600/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0");return `${h}:${m}:${s}`}

function applyTheme(theme){
  document.body.classList.toggle("light", theme==="light");
  localStorage.setItem("neetTheme",theme);
  const label=document.querySelector("#themeLabel");
  const btn=document.querySelector("#themeToggle");
  if(label) label.textContent=theme==="light"?"Dark mode":"Light mode";
  if(btn) btn.firstChild.textContent=theme==="light"?"🌙 ":"☀️ ";
}
function bindTheme(){
  const saved=localStorage.getItem("neetTheme")||"dark";
  applyTheme(saved);
  const btn=document.querySelector("#themeToggle");
  if(btn) btn.onclick=()=>{
    const next=document.body.classList.contains("light")?"dark":"light";
    applyTheme(next);
  };
}


let profile=JSON.parse(localStorage.getItem("neetProfile")||"null");
function initials(name){return (name||"Student").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function applyProfile(){
  const name=(profile?.name||"Student").trim();
  const target=profile?.target||"8 hours";
  document.querySelectorAll("#welcomeName").forEach(e=>e.textContent=name.toUpperCase());
  const side=document.querySelector("#sideName"); if(side) side.textContent=name;
  const brand=document.querySelector("#brandUser"); if(brand) brand.textContent=name+"'s Study Hub";
  const cn=document.querySelector("#communityName"); if(cn) cn.textContent=name;
  ["#sideAvatar","#communityAvatar",".hero-avatar"].forEach(sel=>document.querySelectorAll(sel).forEach(e=>e.textContent=initials(name)));
  const input=document.querySelector("#profileNameInput"); if(input) input.value=name==="Student"?"":name;
  const targetInput=document.querySelector("#profileTargetInput"); if(targetInput) targetInput.value=target;
}
function showProfileSetup(){
  const modal=document.querySelector("#profileSetup"); if(modal) modal.style.display="grid";
}
function saveProfileSetup(){
  const name=document.querySelector("#profileNameInput").value.trim();
  if(!name){document.querySelector("#profileNameInput").focus();return}
  profile={name,target:document.querySelector("#profileTargetInput").value};
  localStorage.setItem("neetProfile",JSON.stringify(profile));
  document.querySelector("#profileSetup").style.display="none";
  applyProfile(); render("dashboard");
}

function render(page="dashboard"){
  activePage=page;
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  const pages={dashboard,syllabus,practice,timer:timerPage,leaderboard,calendar,reports,mock,mockRun:()=>mockTestPage(mockState?.id||"full"),community,aboutCreator};
  document.querySelector("#main").innerHTML=pages[page]();
  bind(page);
  bindTheme();
  applyProfile();
  if(window.updateGoogleLoginDisplay)window.updateGoogleLoginDisplay(window.neetGoogleUser||null);
}

    document.querySelectorAll("[data-target-delete]").forEach(b=>b.onclick=()=>{
      const key=dateKey(selectedCalendarDate), i=Number(b.dataset.targetDelete);
      if(targets[key]) targets[key].splice(i,1);
      saveTargets(); render("calendar");
    });
  }
  if(page==="community"){
    if(document.querySelector("#saveCheckin")) document.querySelector("#saveCheckin").onclick=saveCheckin;
    if(document.querySelector("#postDiscussion")) document.querySelector("#postDiscussion").onclick=addDiscussion;
  }
  if(page==="mock"){
    document.querySelectorAll("[data-start-mock]").forEach(b=>b.onclick=()=>startMock(b.dataset.startMock));
    document.querySelectorAll("[data-view-syllabus]").forEach(b=>b.onclick=()=>{
      const t=mockTests[b.dataset.viewSyllabus];
      alert(Object.entries(t.syllabus).map(([s,chs])=>s+"\n• "+chs.join("\n• ")).join("\n\n"));
    });
  }
  if(page==="mockRun") bindMockTest();
  if(page==="timer"){
    document.querySelector("#start").onclick=()=>{running=!running;if(running){interval=setInterval(()=>{timer++;document.querySelector("#clock").textContent=fmt(timer)},1000)}else clearInterval(interval);document.querySelector("#start").textContent=running?"Pause":"Start"};
    document.querySelector("#save").onclick=()=>{if(timer){const savedSeconds=timer;sessions.push({subject:currentSubject,seconds:savedSeconds,date:new Date().toISOString()});localStorage.setItem("neetSessions",JSON.stringify(sessions));timer=0;running=false;clearInterval(interval);render("timer");publishSavedStudySession(savedSeconds)}};
    document.querySelector("#discard").onclick=()=>{timer=0;running=false;clearInterval(interval);render("timer")};
  }
}
function startCountdown(){
 const el=document.querySelector("#countdown"); if(!el)return;
 // Expected date placeholder: May 2, 2027. Update when the official date is announced.
 const target=new Date("2027-05-02T10:00:00+05:30");
 const tick=()=>{let d=Math.max(0,target-Date.now()),days=Math.floor(d/86400000);d%=86400000;let h=Math.floor(d/3600000);d%=3600000;let m=Math.floor(d/60000);let s=Math.floor(d/1000)%60;el.innerHTML=`<div><strong>${days}</strong><small>days</small></div><div><strong>${h}</strong><small>hrs</small></div><div><strong>${m}</strong><small>min</small></div><div><strong>${s}</strong><small>sec</small></div>`};tick();setInterval(tick,1000)
}
render();
if(!profile) setTimeout(showProfileSetup,250);
const saveProfileBtn=document.querySelector("#saveProfile");
if(saveProfileBtn) saveProfileBtn.onclick=saveProfileSetup;

</script>

      return;

  };

  authClient.auth.getSession().then(({data,error})=>{
    if(error){if(status)status.textContent="Could not check your sign-in status. Refresh and try again.";return}
