r;font-weight:800}.donut-label small{display:block;font-weight:400;color:#8e9ab0;font-size:10px}.legend{flex:1}.legend-row{display:flex;align-items:center;gap:10px;margin:13px 0}.dot{width:12px;height:12px;border-radius:50%}.legend-row .hours{margin-left:auto;color:#a7b0c0}.subject-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.subject{padding:16px 12px;border:1px solid #292e35;border-radius:12px;background:#12161a}.subject.selected{border-color:#5b8def;box-shadow:0 0 0 1px #5b8def inset}.subject b{display:block;margin-bottom:7px}.subject small{color:#8e9ab0}.list{display:flex;flex-direction:column;gap:12px}.chapter{display:flex;align-items:center;gap:18px;border:1px solid #292e35;background:#12161a;border-radius:12px;padding:22px;cursor:pointer}.chapter:hover{border-color:#3c4653}.chapter input{width:22px;height:22px}.chapter .arrow{margin-left:auto;color:#8e9ab0}.notice{padding:16px 18px;background:#14181d;border:1px solid #292e35;border-radius:10px;color:#9eabc0;line-height:1.6}.timer-card{max-width:950px}.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:34px}.tab{background:transparent;border:1px solid #292e35;color:#fff;border-radius:10px;padding:12px;cursor:pointer}.tab.active{border-color:#5b8def;box-shadow:0 0 0 1px #5b8def inset}.clock{text-align:center;font-size:54px;font-weight:800;letter-spacing:-2px;margin:8px 0 24px}.actions{display:grid;grid-template-columns:1fr 1fr 108px;gap:12px}.btn{border:1px solid #2a3038;background:#111419;color:#e7ebf2;border-radius:10px;padding:14px;font-size:16px;font-weight:700;cursor:pointer}.btn.primary{background:#5b8def;border-color:#5b8def}.btn.green{background:#2a6048;border-color:#2a6048}.btn:hover{filter:brightness(1.08)}.pills{display:flex;gap:10px;margin:18px 0 28px}.pill{padding:10px 16px;border-radius:999px;border:1px solid #292e35;background:transparent;color:#8e9ab0;cursor:pointer}.pill.active{background:#f1f3f6;color:#171a1e}.empty{text-align:center;color:#8e9ab0;padding:35px 0}.feature-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.feature{min-height:120px}.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{padding:14px 10px;min-height:70px;border:1px solid #292e35;border-radius:8px;background:#111419}.day strong{display:block}.day.today{border-color:#35e49d}.day.done{background:#10271f}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:14px;border-bottom:1px solid #292e35;color:#b5bfce}.table th{color:#fff}.hero-note{color:#35e49d;font-size:13px;margin-bottom:10px}@media(max-width:800px){.sidebar{width:210px;flex-basis:210px}.subject-grid{grid-template-columns:repeat(2,1fr)}.countdown{gap:8px}.actions{grid-template-columns:1fr}.calendar{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.app{display:block}.sidebar{width:100%;padding:12px;position:sticky;top:0;z-index:5}.brand{margin:4px 10px 10px}.sidebar nav{display:flex;overflow:auto;gap:4px}.nav-item{min-width:max-content;padding:10px}.nav-item span{display:none}main{padding:25px 16px}}


.calendar-wrap{display:grid;grid-template-columns:1fr;gap:18px}
.calendar-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
.calendar-head h2{margin:0;font-size:20px}
.month-nav{display:flex;gap:8px}
.month-nav button{border:1px solid #292e35;background:#111419;color:#e7ebf2;border-radius:8px;padding:8px 12px;cursor:pointer}
.month-nav button:hover{background:#181d23}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.weekday{text-align:center;color:#7f8b9f;font-size:12px;padding:5px}
.calendar-date{min-height:105px;padding:10px;border:1px solid #292e35;border-radius:9px;background:#111419;cursor:pointer;transition:.15s;position:relative}
.calendar-date:hover{border-color:#536174;transform:translateY(-1px)}
.calendar-date.muted-date{opacity:.35}
.calendar-date.today{border-color:#35e49d;box-shadow:0 0 0 1px #35e49d inset}
.calendar-date.selected{border-color:#5b8def;box-shadow:0 0 0 1px #5b8def inset}
.date-number{font-weight:700;font-size:14px}
.target-count{position:absolute;right:9px;top:9px;color:#35e49d;font-size:11px}
.mini-target{font-size:11px;color:#aab4c4;margin-top:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.calendar-editor{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.target-panel h3{margin:0 0 5px}
.target-date-label{color:#8e9ab0;margin-bottom:16px}
.target-input{display:flex;gap:8px;margin-bottom:14px}
.target-input input{flex:1;min-width:0;background:#0d1014;border:1px solid #2b3139;color:#fff;border-radius:8px;padding:12px;outline:none}
.target-input input:focus{border-color:#5b8def}
.target-input button{border:0;background:#5b8def;color:white;border-radius:8px;padding:0 16px;font-weight:700;cursor:pointer}
.target-list{display:flex;flex-direction:column;gap:8px;max-height:300px;overflow:auto}
.target-item{display:flex;align-items:center;gap:10px;padding:10px;background:#0e1115;border:1px solid #272d34;border-radius:8px}
.target-item input{width:17px;height:17px}
.target-item.done span{text-decoration:line-through;color:#6f7989}
.target-item span{flex:1}
.target-delete{border:0;background:transparent;color:#7f8b9f;cursor:pointer;font-size:16px}
.target-delete:hover{color:#ff7d7d}
.no-targets{color:#707b8d;padding:20px 0;text-align:center}
@media(max-width:800px){.calendar-editor{grid-template-columns:1fr}.calendar-date{min-height:85px}}

.theme-toggle button:hover{background:#181d23}

.community-grid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:18px}
.section-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card label{display:block;font-size:13px;font-weight:700;margin:12px 0;color:#cbd3df}.card input,.card select,.card textarea{display:block;width:100%;box-sizing:border-box;margin-top:7px;border:1px solid #303640;background:#0f1217;color:#eef2f7;border-radius:9px;padding:11px 12px;font:inherit;outline:none}.card textarea{min-height:84px;resize:vertical}

.brand-wrap{display:flex;align-items:center;gap:10px;margin-bottom:22px}.brand-wrap .brand{margin:0}.brand-user{font-size:10px;color:#778396;margin-top:2px}.brand-logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#5b8def,#7d5bea);color:#fff;font-weight:900;box-shadow:0 8px 20px rgba(91,141,239,.2)}
.sidebar-profile{display:flex;align-items:center;gap:10px;margin:20px 4px 0;padding:12px;border:1px solid #292e35;background:#111419;border-radius:12px}.profile-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#5b8def;color:#fff;font-weight:900}.sidebar-profile strong{display:block;font-size:13px}.sidebar-profile span{display:block;color:#7f8a9c;font-size:10px;margin-top:2px}

<style>
.mock-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.mock-card{position:relative}
.mock-badge{display:inline-block;font-size:10px;font-weight:800;letter-spacing:1px;padding:5px 8px;border-radius:999px;background:rgba(91,141,239,.12);color:#5b8def;margin-bottom:8px}
.mock-syllabus{margin:16px 0;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--soft)}

.mock-results{display:grid;gap:8px}.mock-result-row{display:grid;grid-template-columns:1fr auto auto;gap:15px;padding:10px 0;border-bottom:1px solid var(--border)}.mock-result-row small{color:var(--muted)}

.mock-live-timer{font-size:20px;font-weight:800}

.mock-side-panel{position:sticky;top:75px}.mock-side-panel hr{border:0;border-top:1px solid var(--border);margin:18px 0}.question-nav{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.question-nav button{border:1px solid var(--border);background:var(--panel);border-radius:8px;padding:8px;cursor:pointer}.question-nav button.answered{background:#5b8def;color:#fff;border-color:#5b8def}.big-submit{width:100%;margin-top:5px}
.result-hero{text-align:center}.result-score{font-size:64px;font-weight:900;line-height:1}.result-score small{font-size:28px}.mock-breakdown-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border)}.review-item{padding:13px;margin:8px 0;border:1px solid var(--border);border-radius:10px}.review-item.correct{border-left:4px solid #49bd79}.review-item.wrong{border-left:4px solid #e06b6b}.review-item div{margin-top:6px;font-size:13px;color:var(--muted)}

  <div class="setup-card">

    <div class="eyebrow">NEET 2027</div>

    <p>Let's personalize your dashboard. Your name is saved only in this browser.</p>
    <label>Your name<input id="profileNameInput" placeholder="Enter your name" maxlength="30" autocomplete="name"></label>
    <label>Daily study target<select id="profileTargetInput"><option>4 hours</option><option>6 hours</option><option selected>8 hours</option><option>10+ hours</option></select></label>
    <button class="btn primary" id="saveProfile">Continue →</button>
  </div>
</div>

  <div class="app">
    <aside class="sidebar">
      <div class="brand-wrap">
      <div class="brand-logo">S</div>
      <div><div class="brand">NEET 2027</div><div class="brand-user" id="brandUser">My Study Hub</div></div>

function pageShell(title,sub,body){return `<h1>${title}</h1><div class="subtitle">${sub}</div>${body}`}

function donut(hours){const total=hours||0;return `<div class="donut" style="background:conic-gradient(#5b8def ${Math.min(total/10*360,360)}deg,#23272e 0deg)"><div class="donut-label">${total.toFixed(1)}h<small>total</small></div></div>`}
function legend(){return Object.keys(subjects).map(s=>`<div class="legend-row"><span class="dot" style="background:${colors[s]}"></span>${s}<span class="hours">${subjectHours(s).toFixed(1)}h</span></div>`).join("")}
function subjectHours(s){return sessions.filter(x=>x.subject===s).reduce((a,x)=>a+x.seconds,0)/3600}
function totalStudy(){return sessions.reduce((a,x)=>a+x.seconds,0)/3600}

function simplePage(title,sub,body){return pageShell(title,sub,body)}
let calendarDate = new Date();
let selectedCalendarDate = new Date();
let targets = JSON.parse(localStorage.getItem("neetDailyTargets") || "{}");

function dateKey(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function prettyDate(d){
  return d.toLocaleDateString("en-IN",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
}
function calendar(){
  const year=calendarDate.getFullYear(), month=calendarDate.getMonth();
  const first=new Date(year,month,1), last=new Date(year,month+1,0);
  const startDay=first.getDay();
  const days=last.getDate();
  const prevDays=new Date(year,month,0).getDate();
  const cells=[];
  for(let i=0;i<42;i++){
    let day=i-startDay+1, d, muted=false;
    if(day<1){d=new Date(year,month-1,prevDays+day);muted=true}
    else if(day>days){d=new Date(year,month+1,day-days);muted=true}
    else d=new Date(year,month,day);
    const key=dateKey(d), list=targets[key]||[];
    const isToday=key===dateKey(new Date()), isSelected=key===dateKey(selectedCalendarDate);
    cells.push(`<button class="calendar-date ${muted?"muted-date":""} ${isToday?"today":""} ${isSelected?"selected":""}" data-date="${key}">
      <span class="date-number">${d.getDate()}</span>
      ${list.length?`<span class="target-count">${list.filter(x=>x.done).length}/${list.length}</span>`:""}
      ${list.slice(0,2).map(x=>`<div class="mini-target">${x.done?"✓ ":""}${escapeHtml(x.text)}</div>`).join("")}
    </button>`);
  }
  const list=targets[dateKey(selectedCalendarDate)]||[];
  return pageShell("Study Calendar","Plan exactly what you want to finish each day — your daily targets are saved automatically.",`
  <div class="calendar-wrap">
    <section class="card">
      <div class="calendar-head">
        <h2>${calendarDate.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}</h2>
        <div class="month-nav">
          <button id="prevMonth">←</button><button id="todayMonth">Today</button><button id="nextMonth">→</button>
        </div>
      </div>
      <div class="calendar-grid">
        ${["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].map(x=>`<div class="weekday">${x}</div>`).join("")}
        ${cells.join("")}
      </div>
    </section>
    <section class="card target-panel">
      <h3>Daily Targets</h3>
      <div class="target-date-label">${prettyDate(selectedCalendarDate)}</div>
      <div class="target-input">
        <input id="targetInput" placeholder="e.g. Complete Kinematics numericals" />
        <button id="addTarget">Add</button>
      </div>
      <div class="target-list">
        ${list.length ? list.map((x,i)=>`<div class="target-item ${x.done?"done":""}">
          <input type="checkbox" data-target-toggle="${i}" ${x.done?"checked":""}>
          <span>${escapeHtml(x.text)}</span>
          <button class="target-delete" data-target-delete="${i}">×</button>
        </div>`).join("") : `<div class="no-targets">No targets for this day yet.<br>Add your first task above.</div>`}
      </div>
    </section>
  </div>`);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function saveTargets(){
  localStorage.setItem("neetDailyTargets",JSON.stringify(targets));
}
function addTarget(text){
  const key=dateKey(selectedCalendarDate);
  if(!text.trim()) return;
  if(!targets[key]) targets[key]=[];
  targets[key].push({text:text.trim(),done:false});
  saveTargets(); render("calendar");
}

let mockState = null;
let mockTimer = null;

function syllabusList(syl){
  return Object.entries(syl).map(([sub,chs]) =>
    `<div class="mock-syllabus-group"><strong>${sub}</strong><div>${chs.map(c=>`<span class="tag">${esc(c)}</span>`).join("")}</div></div>`
  ).join("");
}

function mock(){
  const results=JSON.parse(localStorage.getItem("neetMockResults")||"[]");
  const resultHtml=results.slice(0,5).map(r=>`<div class="mock-result-row"><span>${esc(r.title)}</span><strong>${r.score}/${r.total}</strong><small>${new Date(r.date).toLocaleDateString()}</small></div>`).join("");
  return simplePage("Mock Tests","Choose a paper, review its syllabus, and take the test with a live timer.",`
    <div class="mock-grid">
      ${Object.entries(mockTests).map(([id,t])=>`
        <section class="card mock-card">
          <div class="mock-badge">${id==="full"?"FULL MOCK":"CHAPTER TEST"}</div>
          <h2>${t.title}</h2>

  `);
}

function mockTestPage(id){
  const t=mockTests[id];
  const answers=mockState?.answers||{};
  const remaining=mockState?.remaining??t.duration*60;
  const mm=String(Math.floor(remaining/60)).padStart(2,"0"), ss=String(remaining%60).padStart(2,"0");
  const qHtml=t.questions.map((q,i)=>{
    const selected=answers[i];
    return `<article class="mock-question" id="q${i}">
      <div class="question-top"><span class="tag">${q.s}</span><strong>Q${i+1}</strong></div>
      <h3>${esc(q.q)}</h3>
      <div class="options">${q.o.map((op,j)=>`<label class="${selected===j?"selected":""}"><input type="radio" name="q${i}" value="${j}" ${selected===j?"checked":""} data-answer="${i}"><span>${String.fromCharCode(65+j)}. ${esc(op)}</span></label>`).join("")}</div>
    </article>`;
  }).join("");
  return simplePage(t.title,`${t.questions.length} questions · ${t.duration} minutes · ${t.description}`,`
    <div class="mock-test-toolbar">
      <button class="btn" id="backMocks">← Back to Mock Tests</button>
      <div class="mock-live-timer">⏱ <strong id="mockClock">${mm}:${ss}</strong></div>
      <button class="btn primary" id="submitMock">Submit test</button>
    </div>
    <div class="mock-test-layout">
      <section class="mock-paper card">${qHtml}<button class="btn primary big-submit" id="submitMockBottom">Submit test</button></section>
      <aside class="card mock-side-panel">
        <h2>Paper syllabus</h2>${syllabusList(t.syllabus)}
        <hr><h3>Question navigator</h3>
        <div class="question-nav">${t.questions.map((_,i)=>`<button class="${answers[i]!==undefined?"answered":""}" data-jump="${i}">${i+1}</button>`).join("")}</div>
        <p class="muted small">Answered questions are marked in the navigator.</p>
      </aside>
    </div>
  `);
}

function finishMock(){
  if(!mockState)return;
  const t=mockTests[mockState.id];
  clearInterval(mockTimer); mockTimer=null;
  let score=0;
  t.questions.forEach((q,i)=>{if(mockState.answers[i]===q.a)score++;});
  const results=JSON.parse(localStorage.getItem("neetMockResults")||"[]");
  results.unshift({title:t.title,score,total:t.questions.length,date:new Date().toISOString()});
  localStorage.setItem("neetMockResults",JSON.stringify(results.slice(0,20)));
  const breakdown=Object.entries(t.questions.reduce((a,q,i)=>{
    a[q.s]??={correct:0,total:0};a[q.s].total++;if(mockState.answers[i]===q.a)a[q.s].correct++;return a;
  },{})).map(([sub,v])=>`<div class="mock-breakdown-row"><span>${sub}</span><strong>${v.correct}/${v.total}</strong></div>`).join("");
  document.querySelector("#main").innerHTML=pageShell("Test Result",t.title,`
    <section class="card result-hero"><div class="result-score">${score}<small>/${t.questions.length}</small></div><h2>${score===t.questions.length?"Perfect score!":score>=t.questions.length*.7?"Strong attempt!":"Keep practicing — review the paper below."}</h2><p class="muted">Your result has been saved on this browser.</p></section>
    <section class="card"><h2>Subject breakdown</h2>${breakdown}</section>
    <section class="card"><h2>Question review</h2>${t.questions.map((q,i)=>{
      const your=mockState.answers[i], ok=your===q.a;
      return `<div class="review-item ${ok?"correct":"wrong"}"><strong>Q${i+1}. ${esc(q.q)}</strong><div>Your answer: ${your===undefined?"Not answered":esc(q.o[your])}</div><div>Correct answer: ${esc(q.o[q.a])}</div></div>`;
    }).join("")}</section>
    <button class="btn primary" id="backToMocks">Back to Mock Tests</button>
  `);
  mockState=null;
  applyProfile();
  document.querySelector("#backToMocks").onclick=()=>render("mock");
}

function startMock(id){
  clearInterval(mockTimer);
  const t=mockTests[id];
  mockState={id,answers:{},remaining:t.duration*60};
  render("mockRun");
}

function bindMockTest(){
  if(!mockState)return;
  const t=mockTests[mockState.id];
  document.querySelectorAll("[data-answer]").forEach(inp=>inp.onchange=()=>{
    mockState.answers[Number(inp.dataset.answer)]=Number(inp.value);
    inp.closest("label").classList.add("selected");
    const nav=document.querySelector(`[data-jump="${inp.dataset.answer}"]`);
    if(nav)nav.classList.add("answered");
  });
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>document.querySelector("#q"+b.dataset.jump)?.scrollIntoView({behavior:"smooth",block:"start"}));
  document.querySelector("#backMocks").onclick=()=>{clearInterval(mockTimer);mockState=null;render("mock")};
  document.querySelector("#submitMock").onclick=finishMock;
  document.querySelector("#submitMockBottom").onclick=finishMock;
  mockTimer=setInterval(()=>{
    if(!mockState)return;
    mockState.remaining--;
    const el=document.querySelector("#mockClock");
    if(el){const m=String(Math.max(0,Math.floor(mockState.remaining/60))).padStart(2,"0"),s=String(Math.max(0,mockState.remaining%60)).padStart(2,"0");el.textContent=`${m}:${s}`;}
    if(mockState.remaining<=0)finishMock();
  },1000);
}

function todayKey(){return dateKey(new Date())}
function calcStreak(){
  let streak=0,d=new Date();
  while(checkins[dateKey(d)]){streak++;d.setDate(d.getDate()-1)}
  return streak;
}
function longestStreak(){
  const keys=Object.keys(checkins).sort();let best=0,run=0,prev=null;
  keys.forEach(k=>{const d=new Date(k+"T00:00:00");if(prev&&(d-prev)/86400000===1)run++;else run=1;best=Math.max(best,run);prev=d});
  return best;
}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function saveCheckin(){
  const k=todayKey();
  checkins[k]={mood:checkMood.value,target:checkTarget.value,studied:checkStudied.value.trim(),goal:checkGoal.value.trim(),difficulty:checkDifficulty.value.trim(),rating:checkRating.value};
  localStorage.setItem("neetCheckins",JSON.stringify(checkins));render("community");
}
function addDiscussion(){
  const t=discussionText.value.trim();if(!t)return;
  discussions.unshift({type:discussionType.value,text:t,date:new Date().toISOString()});
  localStorage.setItem("neetDiscussions",JSON.stringify(discussions));render("community");
}
function community(){
  const c=checkins[todayKey()]||{},streak=calcStreak(),longest=longestStreak();
  const posts=discussions.map(p=>`<article class="card discussion-post"><div class="post-head"><span class="tag">${esc(p.type)}</span><small class="muted">${new Date(p.date).toLocaleString()}</small></div><p>${esc(p.text)}</p></article>`).join("")||`<div class="empty">No discussions yet. Start the first one.</div>`;
  return simplePage("Community","Check in daily, keep your streak alive, and discuss your NEET preparation.",`
  <div class="identity-strip">
  <div class="identity-avatar" id="communityAvatar">S</div>
  <div><strong id="communityName">Student</strong><span>NEET 2027 Aspirant · Building consistency every day</span></div>
  <div class="identity-chip">🎯 Focus Mode</div>
</div>
<div class="community-grid">
    <section class="card checkin-card">
      <div class="section-head"><div><h2>📝 Daily Check-in</h2><p class="muted">Record today's study plan and reflection.</p></div><div class="streak-badge">🔥 ${streak} day${streak===1?"":"s"}<small>current streak</small></div></div>
      <div class="streak-stats"><div><b>${streak}</b><span>Current streak</span></div><div><b>${longest}</b><span>Longest streak</span></div><div><b>${Object.keys(checkins).length}</b><span>Check-ins</span></div></div>
      <div class="form-grid">
        <label>How are you feeling?<select id="checkMood"><option ${c.mood==="Great"?"selected":""}>Great</option><option ${c.mood==="Good"?"selected":""}>Good</option><option ${c.mood==="Okay"?"selected":""}>Okay</option><option ${c.mood==="Tired"?"selected":""}>Tired</option></select></label>
        <label>Study target<select id="checkTarget"><option value="">Select</option><option ${c.target==="4 hours"?"selected":""}>4 hours</option><option ${c.target==="6 hours"?"selected":""}>6 hours</option><option ${c.target==="8 hours"?"selected":""}>8 hours</option><option ${c.target==="10+ hours"?"selected":""}>10+ hours</option></select></label>
        <label>Hours actually studied<input id="checkStudied" value="${esc(c.studied)}" placeholder="e.g. 6.5 hours"></label>
        <label>Daily rating<select id="checkRating"><option value="5" ${c.rating==="5"?"selected":""}>⭐⭐⭐⭐⭐</option><option value="4" ${c.rating==="4"?"selected":""}>⭐⭐⭐⭐</option><option value="3" ${c.rating==="3"?"selected":""}>⭐⭐⭐</option><option value="2" ${c.rating==="2"?"selected":""}>⭐⭐</option><option value="1" ${c.rating==="1"?"selected":""}>⭐</option></select></label>
      </div>
      <label>Main goal for today<input id="checkGoal" value="${esc(c.goal)}" placeholder="e.g. Complete Thermodynamics"></label>
      <label>What was difficult today?<textarea id="checkDifficulty" placeholder="Write a short reflection...">${esc(c.difficulty)}</textarea></label>
      <button class="btn primary" id="saveCheckin">Save today's check-in</button>
    </section>
    <section class="card discussion-card">
      <div class="section-head"><div><h2>💬 Discussion</h2><p class="muted">Ask doubts, share tips, or post a study update.</p></div></div>
      <div class="discussion-compose"><select id="discussionType"><option>Question</option><option>Study Update</option><option>Tip</option><option>Resource</option></select><textarea id="discussionText" placeholder="Write your question or study update..."></textarea><button class="btn green" id="postDiscussion">Post to discussion</button></div>
      <div class="discussion-list">${posts}</div>
    </section>
  </div>`);
}
function fmt(sec){const h=String(Math.floor(sec/3600)).padStart(2,"0"),m=String(Math.floor(sec%3600/60)).padStart(2,"0"),s=String(sec%60).padStart(2,"0");return `${h}:${m}:${s}`}

function applyTheme(theme){
  document.body.classList.toggle("light", theme==="light");
  localStorage.setItem("neetTheme",theme);
  const label=document.querySelector("#themeLabel");
  const btn=document.querySelector("#themeToggle");
  if(label) label.textContent=theme==="light"?"Dark mode":"Light mode";
  if(btn) btn.firstChild.textContent=theme==="light"?"🌙 ":"☀️ ";
}
function bindTheme(){
  const saved=localStorage.getItem("neetTheme")||"dark";
  applyTheme(saved);
  const btn=document.querySelector("#themeToggle");
  if(btn) btn.onclick=()=>{
    const next=document.body.classList.contains("light")?"dark":"light";
    applyTheme(next);
  };
}


let profile=JSON.parse(localStorage.getItem("neetProfile")||"null");
function initials(name){return (name||"Student").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase()}
function applyProfile(){
  const name=(profile?.name||"Student").trim();
  const target=profile?.target||"8 hours";
  document.querySelectorAll("#welcomeName").forEach(e=>e.textContent=name.toUpperCase());
  const side=document.querySelector("#sideName"); if(side) side.textContent=name;
  const brand=document.querySelector("#brandUser"); if(brand) brand.textContent=name+"'s Study Hub";
  const cn=document.querySelector("#communityName"); if(cn) cn.textContent=name;
  ["#sideAvatar","#communityAvatar",".hero-avatar"].forEach(sel=>document.querySelectorAll(sel).forEach(e=>e.textContent=initials(name)));
  const input=document.querySelector("#profileNameInput"); if(input) input.value=name==="Student"?"":name;
  const targetInput=document.querySelector("#profileTargetInput"); if(targetInput) targetInput.value=target;
}
function showProfileSetup(){
  const modal=document.querySelector("#profileSetup"); if(modal) modal.style.display="grid";
}
function saveProfileSetup(){
  const name=document.querySelector("#profileNameInput").value.trim();
  if(!name){document.querySelector("#profileNameInput").focus();return}
  profile={name,target:document.querySelector("#profileTargetInput").value};
  localStorage.setItem("neetProfile",JSON.stringify(profile));
  document.querySelector("#profileSetup").style.display="none";
  applyProfile(); render("dashboard");
}

function render(page="dashboard"){
  document.querySelectorAll(".nav-item").forEach(b=>b.classList.toggle("active",b.dataset.page===page));
  const pages={dashboard,syllabus,timer:timerPage,leaderboard,calendar,reports,mock,mockRun:()=>mockTestPage(mockState?.id||"full"),community,aboutCreator};
  document.querySelector("#main").innerHTML=pages[page]();
  bind(page);
  bindTheme();
  applyProfile();
}
function bind(page){
  if(page==="dashboard") startCountdown();
  document.querySelectorAll("[data-page]").forEach(b=>b.onclick=()=>render(b.dataset.page));
  document.querySelectorAll("[data-subject]").forEach(b=>b.onclick=()=>{currentSubject=b.dataset.subject;render("syllabus")});
  document.querySelectorAll("[data-check]").forEach(c=>c.onchange=()=>{checked[c.dataset.check]=c.checked;localStorage.setItem("neetChecked",JSON.stringify(checked));render("syllabus")});
  document.querySelectorAll("[data-timersubject]").forEach(b=>b.onclick=()=>{currentSubject=b.dataset.timersubject;render("timer")});
  if(page==="calendar"){
    document.querySelectorAll("[data-date]").forEach(b=>b.onclick=()=>{
      const [y,m,d]=b.dataset.date.split("-").map(Number);
      selectedCalendarDate=new Date(y,m-1,d);
      render("calendar");
    });
    document.querySelector("#prevMonth").onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()-1);render("calendar")};
    document.querySelector("#nextMonth").onclick=()=>{calendarDate.setMonth(calendarDate.getMonth()+1);render("calendar")};
    document.querySelector("#todayMonth").onclick=()=>{calendarDate=new Date();selectedCalendarDate=new Date();render("calendar")};
    document.querySelector("#addTarget").onclick=()=>addTarget(document.querySelector("#targetInput").value);
    document.querySelector("#targetInput").onkeydown=e=>{if(e.key==="Enter")addTarget(e.target.value)};
    document.querySelectorAll("[data-target-toggle]").forEach(b=>b.onchange=()=>{
      const key=dateKey(selectedCalendarDate), i=Number(b.dataset.targetToggle);
      if(targets[key]?.[i]) targets[key][i].done=b.checked;
      saveTargets(); render("calendar");
    });
    document.querySelectorAll("[data-target-delete]").forEach(b=>b.onclick=()=>{
      const key=dateKey(selectedCalendarDate), i=Number(b.dataset.targetDelete);
      if(targets[key]) targets[key].splice(i,1);
      saveTargets(); render("calendar");
    });
  }
  if(page==="community"){
    if(document.querySelector("#saveCheckin")) document.querySelector("#saveCheckin").onclick=saveCheckin;
    if(document.querySelector("#postDiscussion")) document.querySelector("#postDiscussion").onclick=addDiscussion;
  }
  if(page==="mock"){
    document.querySelectorAll("[data-start-mock]").forEach(b=>b.onclick=()=>startMock(b.dataset.startMock));
    document.querySelectorAll("[data-view-syllabus]").forEach(b=>b.onclick=()=>{
      const t=mockTests[b.dataset.viewSyllabus];
      alert(Object.entries(t.syllabus).map(([s,chs])=>s+"\n• "+chs.join("\n• ")).join("\n\n"));
    });
  }
  if(page==="mockRun") bindMockTest();
  if(page==="timer"){
    document.querySelector("#start").onclick=()=>{running=!running;if(running){interval=setInterval(()=>{timer++;document.querySelector("#clock").textContent=fmt(timer)},1000)}else clearInterval(interval);document.querySelector("#start").textContent=running?"Pause":"Start"};
    document.querySelector("#save").onclick=()=>{if(timer){sessions.push({subject:currentSubject,seconds:timer,date:new Date().toISOString()});localStorage.setItem("neetSessions",JSON.stringify(sessions));timer=0;running=false;clearInterval(interval);render("timer")}};
    document.querySelector("#discard").onclick=()=>{timer=0;running=false;clearInterval(interval);render("timer")};
  }
}
function startCountdown(){
 const el=document.querySelector("#countdown"); if(!el)return;
 // Expected date placeholder: May 2, 2027. Update when the official date is announced.
 const target=new Date("2027-05-02T10:00:00+05:30");
 const tick=()=>{let d=Math.max(0,target-Date.now()),days=Math.floor(d/86400000);d%=86400000;let h=Math.floor(d/3600000);d%=3600000;let m=Math.floor(d/60000);let s=Math.floor(d/1000)%60;el.innerHTML=`<div><strong>${days}</strong><small>days</small></div><div><strong>${h}</strong><small>hrs</small></div><div><strong>${m}</strong><small>min</small></div><div><strong>${s}</strong><small>sec</small></div>`};tick();setInterval(tick,1000)
}
render();
if(!profile) setTimeout(showProfileSetup,250);
const saveProfileBtn=document.querySelector("#saveProfile");
if(saveProfileBtn) saveProfileBtn.onclick=saveProfileSetup;

</script>
